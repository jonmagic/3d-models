<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">4. Break down and label the structural panels</title>
<desc id="desc">Cut oversize, establish one reference edge, then finish-cut and label.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#cbd5e1" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="720" fill="#f8fafc"/>
<rect x="24" y="24" width="1152" height="672" rx="18" fill="url(#grid)" stroke="#cbd5e1" stroke-width="2"/>
<text x="60" y="72" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="800" fill="#0f172a">4. Break down and label the structural panels</text>
<text x="60" y="104" font-family="system-ui,-apple-system,sans-serif" font-size="19" font-weight="500" fill="#475569">Cut oversize, establish one reference edge, then finish-cut and label.</text>
<rect x="90" y="160" width="650" height="440" rx="4" fill="#f5deb3" stroke="#334155" stroke-width="3"/>
<text x="415.0" y="387.0" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" fill="#0f172a">23/32 in structural sheet</text>
<line x1="270" y1="160" x2="270" y2="600" stroke="#2563eb" stroke-width="4" stroke-dasharray="12 8"/>
<line x1="475" y1="160" x2="475" y2="600" stroke="#2563eb" stroke-width="4" stroke-dasharray="12 8"/>
<line x1="635" y1="160" x2="635" y2="600" stroke="#2563eb" stroke-width="4" stroke-dasharray="12 8"/>
<line x1="90" y1="315" x2="740" y2="315" stroke="#2563eb" stroke-width="4" stroke-dasharray="12 8"/>
<line x1="90" y1="455" x2="740" y2="455" stroke="#2563eb" stroke-width="4" stroke-dasharray="12 8"/>
<text x="180" y="240" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="19" font-weight="700" fill="#0f172a">bottoms</text>
<text x="370" y="240" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="19" font-weight="700" fill="#0f172a">walls</text>
<text x="570" y="240" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="19" font-weight="700" fill="#0f172a">bulkheads</text>
<text x="180" y="395" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="19" font-weight="700" fill="#0f172a">rails</text>
<text x="420" y="395" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="19" font-weight="700" fill="#0f172a">crossmember strips</text>
<text x="670" y="535" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="19" font-weight="700" fill="#0f172a">coupons</text>
<rect x="790" y="175" width="350" height="126" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
<text x="808" y="209" text-anchor="start" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="600" fill="#0f172a">Blue tape labels:</text>
<text x="808" y="237" text-anchor="start" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="600" fill="#0f172a">LH-1, CH-1, RH-1</text>
<text x="808" y="265" text-anchor="start" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="600" fill="#0f172a">LF-1, CF-1, RF-1</text>
<rect x="790" y="410" width="350" height="126" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
<text x="808" y="444" text-anchor="start" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="600" fill="#0f172a">Mark face + grain</text>
<text x="808" y="472" text-anchor="start" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="600" fill="#0f172a">Keep paired parts together</text>
<text x="808" y="500" text-anchor="start" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="600" fill="#0f172a">Do not cut adapter yet</text>
</svg>
