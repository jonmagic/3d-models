<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">10. Laminate, fit, label, and retain crossmembers</title>
<desc id="desc">Five load stations use six physical pieces because station A is split.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#cbd5e1" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="720" fill="#f8fafc"/>
<rect x="24" y="24" width="1152" height="672" rx="18" fill="url(#grid)" stroke="#cbd5e1" stroke-width="2"/>
<text x="60" y="72" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="800" fill="#0f172a">10. Laminate, fit, label, and retain crossmembers</text>
<text x="60" y="104" font-family="system-ui,-apple-system,sans-serif" font-size="19" font-weight="500" fill="#475569">Five load stations use six physical pieces because station A is split.</text>
<rect x="120" y="185" width="850" height="65" rx="4" fill="#c4b5fd" stroke="#334155" stroke-width="3"/>
<text x="545.0" y="224.5" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" fill="#0f172a">two glued plywood laminations</text>
<rect x="120" y="300" width="850" height="65" rx="4" fill="#a78bfa" stroke="#334155" stroke-width="3"/>
<text x="545.0" y="339.5" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" fill="#0f172a">finished laminated member</text>
<rect x="330" y="430" width="430" height="110" rx="4" fill="#f5deb3" stroke="#334155" stroke-width="3"/>
<text x="545.0" y="492.0" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" fill="#0f172a">receiving notch</text>
<rect x="470" y="365" width="150" height="175" rx="4" fill="#a78bfa" stroke="#334155" stroke-width="3"/>
<text x="545.0" y="459.5" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" fill="#0f172a">member</text>
<line x1="120" y1="275" x2="970" y2="275" stroke="#2563eb" stroke-width="2"/>
<line x1="120" y1="267" x2="120" y2="283" stroke="#2563eb" stroke-width="2"/>
<line x1="970" y1="267" x2="970" y2="283" stroke="#2563eb" stroke-width="2"/>
<text x="545.0" y="265" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">full station width; head station is split</text>
<line x1="1030" y1="365" x2="1030" y2="540" stroke="#2563eb" stroke-width="2"/>
<line x1="1022" y1="365" x2="1038" y2="365" stroke="#2563eb" stroke-width="2"/>
<line x1="1022" y1="540" x2="1038" y2="540" stroke="#2563eb" stroke-width="2"/>
<text x="1044" y="459.5" text-anchor="start" font-family="system-ui,-apple-system,sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">5.5 in</text>
<rect x="75" y="565" width="350" height="98" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
<text x="93" y="599" text-anchor="start" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="600" fill="#0f172a">Label A-L, A-R, B, C, D, E</text>
<text x="93" y="627" text-anchor="start" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="600" fill="#0f172a">Dry-fit before hold-downs</text>
<rect x="760" y="565" width="350" height="126" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
<text x="778" y="599" text-anchor="start" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="600" fill="#0f172a">Retain against uplift</text>
<text x="778" y="627" text-anchor="start" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="600" fill="#0f172a">Fasten into face-grain cleats</text>
<text x="778" y="655" text-anchor="start" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="600" fill="#0f172a">Keep removable</text>
</svg>
