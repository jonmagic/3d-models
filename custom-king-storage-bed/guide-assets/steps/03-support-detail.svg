<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">3. Fabricate the seventeen floor supports</title>
<desc id="desc">Keep the full wood footprint on the LVP and capture it in both axes without point feet.</desc>
